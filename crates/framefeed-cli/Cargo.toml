[package]
name = "framefeed-cli"
description = "Command-line interface for framefeed, a terminal video player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "framefeed"
path = "src/main.rs"

[dependencies]
framefeed-core = { path = "../framefeed-core" }
framefeed-decode = { path = "../framefeed-decode" }
framefeed-proto = { path = "../framefeed-proto" }
framefeed-server = { path = "../framefeed-server" }
framefeed-source = { path = "../framefeed-source" }
ctrlc = "3"

[lints]
workspace = true
